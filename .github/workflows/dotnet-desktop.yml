name: .NET build which creates nuget package with IDEA StatiCa project templates

on:
  push:
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '10.0.x'
  package_version: 1.0.${{ github.run_number }}

jobs:
  BuildAndTest:
    name: "Build and Test IOM"
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: .NET project version updater
      uses: vers-one/dotnet-project-version-updater@v1.3
      with:
        file: src/IdeaStatiCa.Dotnet.Templates.csproj
        version: ${{ env.package_version }}           

    - name: Install dependencies
      run: dotnet restore src/IdeaStatiCa.Dotnet.Templates.csproj

    - name: Build IdeaStatiCa.Dotnet.Templates.csproj
      run: dotnet build src/IdeaStatiCa.Dotnet.Templates.csproj --configuration Release

    - name: Pack IdeaStatiCa.Dotnet.Templates.csproj
      run: dotnet pack src/IdeaStatiCa.Dotnet.Templates.csproj --configuration Release -o src/nuget --no-restore

    - uses: actions/upload-artifact@v4
      with:
        name: IdeaStatiCa.Dotnet.Templates
        path: src/nuget/*.nupkg

  TestTemplates:
    name: "Create and build ${{ matrix.template }} (${{ matrix.framework }})"
    needs: BuildAndTest
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { template: bimapicadapp, framework: net10.0-windows10.0.22621.0 }
          - { template: bimapicadapp, framework: net8.0-windows }
          - { template: bimapicadapp, framework: net48 }
          - { template: bimapifeaapp, framework: net10.0-windows }
          - { template: bimapifeaapp, framework: net8.0-windows }
          - { template: bimapifeaapp, framework: net48 }
          - { template: conapiconsole, framework: net10.0 }
          - { template: conapiconsole, framework: net8.0 }
          - { template: conapiconsole, framework: net48 }
          - { template: rcsclientconsole, framework: net10.0 }
          - { template: rcsclientconsole, framework: net8.0 }
          - { template: rcsclientconsole, framework: net48 }

    steps:
    - uses: actions/download-artifact@v4
      with:
        name: IdeaStatiCa.Dotnet.Templates
        path: nuget

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          ${{ env.DOTNET_VERSION }}

    - name: Install templates
      shell: pwsh
      run: dotnet new install (Get-ChildItem nuget/*.nupkg).FullName

    - name: Create project from template
      run: dotnet new ${{ matrix.template }} -F ${{ matrix.framework }} -o generated

    - name: Build generated project
      run: dotnet build generated --configuration Release
